<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#08051c">

    <title>Radhe Radhe ✨</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="scene" id="scene">

    <!-- Background -->
    <div class="background-glow"></div>
    <div class="stars" id="stars"></div>
    <div class="particles" id="particles"></div>
    <div class="petals" id="petals"></div>

    <!-- Moon -->
    <div class="moon"></div>

    <!-- Decorative light -->
    <div class="light-rays"></div>

    <!-- Main artwork -->
    <section class="artwork-area">

        <div class="image-glow"></div>

        <img
            id="mainImage"
            class="radha-krishna"
            src="assets/radha-krishna.jpg"
            alt="Radha and Krishna"
        >

    </section>

    <!-- Text -->
    <section class="title">

        <h1>राधे राधे</h1>

        <p>Radhe Radhe</p>

    </section>


    <!-- Controls -->
    <section class="controls">

        <button
            id="playBtn"
            aria-label="Pause animation">
            ❚❚
        </button>

        <button
            id="musicBtn"
            aria-label="Play music">
            ♫
        </button>

        <button
            id="replayBtn"
            aria-label="Replay animation">
            ↻
        </button>

        <button
            id="fullscreenBtn"
            aria-label="Fullscreen">
            ⛶
        </button>

    </section>


    <!-- Music status -->
    <div class="music-status" id="musicStatus">
        Music: OFF
    </div>


    <!-- Audio -->
    <audio
        id="music"
        preload="auto"
        loop>

        <source
            src="assets/radha-krishna.mp3"
            type="audio/mpeg">

        Your browser does not support audio.

    </audio>


    <!-- Bottom message -->
    <div class="scroll-hint">
        ✦ Scroll to explore ✦
    </div>

</main>


<script src="script.js"></script>

</body>
</html>
